    .ops {fill:#e9eef4;stroke:#667f99;stroke-width:2}
    .ext {fill:#f4f7fa;stroke:#7d90a2;stroke-width:2}
    .zone {fill:#fafbfd;stroke:#bdc9d3;stroke-width:1.6}
  </style>
</defs>
<rect x="0" y="0" width="1200" height="1697" fill="white"/>
<text x="60" y="66" class="heading">DataChat Agent · Google Cloud deployment</text>
