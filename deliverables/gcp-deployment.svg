  <style>
    text {font-family:DejaVu Sans,Arial,sans-serif; fill:#1b2e40}
    .heading {font-size:31px; font-weight:700}
    .sub {font-size:16px; fill:#536476}
    .section {font-size:20px; font-weight:700}
    .node {font-size:17px; font-weight:650; text-anchor:middle}
    .small {font-size:14px; fill:#40566a; text-anchor:middle}
    .legend {font-size:15px}
    .wire {fill:none;stroke:#526579;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .dashed {stroke-dasharray:7 5}
    .cr {fill:#e1f0ff;stroke:#287ac8;stroke-width:2}
